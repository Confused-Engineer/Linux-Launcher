[package]
name = "linuxlauncher"
version = "3.0.0"
edition = "2024"
rust-version = "1.95" # required by egui 0.37
description = "A Linux-inspired, grid-style app launcher for Windows"
authors = ["Confused Engineer"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Confused-Engineer/Linux-Launcher"
readme = "README.md"
publish = false

[[bin]]
name = "LinuxLauncher"
path = "src/main.rs"

[dependencies]
# UI: egui drawn on the CPU (src/cpu.rs), same as M365 Security Audit and
# Windows-Configurator. No Direct3D/OpenGL, so it renders the same in GPU-less
# VMs, RDP sessions and on real hardware.
# `monochrome_emoji_fonts` bundles the icon glyphs used throughout the UI
# (⛭ 🗕 📂 🛡 …) and implies `default_fonts`.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = [
    "clipboard", # copy/paste in text fields (e.g. pasting paths)
    "links",     # hyperlinks open in the browser (Settings → About)
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
hdrshot-egui-backend = "0.2.0" # tile-caching CPU rasterizer for egui (lib name egui_software_backend)
bytemuck = "1"
# Image loaders for custom icons: local files, https URLs, raster and SVG.
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "http", "image", "svg"] }
# Decoders for egui_extras' image loader, and `ico` for the window icon.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
rust-ini = "0.21" # import of legacy LL.ini files
rfd = "0.18.0" # native file/folder pickers

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm", # native rounded corners (softbuffer can't do transparency)
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
static_vcruntime = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
