name: Rust-Release-Nightly

on:
  push:
    branches: [main]

jobs:
  build_windows_exe:
    name: Build Windows Installer
    # Self-hosted runner with signtool, Inno Setup and `checksum` installed.
    runs-on: "windows"
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release --locked

      - name: Build and package
        run: |
          $ErrorActionPreference = "Stop"
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          cargo build --release --locked
          signtool.exe sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a ".\target\release\LinuxLauncher.exe"
          Copy-Item -Path ".\target\release\LinuxLauncher.exe" -Destination ".\assets\"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" ".\assets\Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          checksum generate ".\assets\LinuxLauncher.exe" -o ".\assets\checksums.txt"
          checksum generate ".\assets\Output\LinuxLauncherSetup.exe" -o ".\assets\checksums.txt"

      - name: Temporarily Save File
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ./assets/Output/LinuxLauncherSetup.exe
            ./assets/LinuxLauncher.exe
            ./assets/checksums.txt
          retention-days: 1

      - name: Cleanup
        if: always()
        run: |
          cargo clean
          Remove-Item ".\assets\LinuxLauncher.exe" -ErrorAction SilentlyContinue
          Remove-Item ".\assets\Output" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item ".\assets\checksums.txt" -ErrorAction SilentlyContinue

  publish_release:
    name: Publish Files
    runs-on: "windows"
    needs: build_windows_exe
    steps:
      - uses: actions/checkout@v4

      - name: Get Files
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: "ModeSevenIndustrialSolutions/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "nightly"
          prerelease: true
          title: "Dev Build"
          files: |
            ./artifacts/Output/LinuxLauncherSetup.exe
            ./artifacts/checksums.txt
            ./artifacts/LinuxLauncher.exe
